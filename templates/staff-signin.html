<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Staff sign in for Luigi's Pizzeria order management.">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Staff Sign In | Luigi's Pizzeria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}?v=20261025-1">
</head>
<body class="staff">
  <a class="skip-link" href="#staff-main">Skip to main content</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Luigi's Pizzeria home">Luigi's <span>Staff Portal</span></a>
  </header>

  <main id="staff-main" class="container" tabindex="-1">
    <section class="staff-login card" aria-labelledby="staff-heading">
      <h1 id="staff-heading" tabindex="-1">Employee sign in</h1>
      <p class="muted">Sign in with the work email and password provided by the owner or a manager.</p>

      <form id="staffForm">
        <label for="employeeId">Work email</label>
        <input id="employeeId" name="email" type="email" autocomplete="username" maxlength="254" required>

        <label for="staffPassword">Password</label>
        <input id="staffPassword" name="password" type="password" autocomplete="current-password" required>

        <button class="btn block" type="submit">Sign in</button>
      </form>
      <p id="staffMessage" class="message" role="alert" aria-atomic="true"></p>

    </section>
  </main>

  <footer class="site-footer">
    <a href="/">Back to Luigi's Pizzeria</a>
  </footer>

  <script src="{{ url_for('static', filename='js/staff-signin.js') }}" defer></script>
</body>
</html>
